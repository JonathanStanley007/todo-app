<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 80px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    /* Input area */
    .input-section {
      padding: 24px 24px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .task-input {
      flex: 1;
      padding: 13px 18px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 0.97rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .task-input::placeholder {
      color: #bbb;
    }

    .task-input:focus {
      border-color: #667eea;
    }

    .add-btn {
      padding: 13px 22px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    /* Filter tabs */
    .filters {
      display: flex;
      padding: 12px 24px;
      gap: 6px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #888;
      transition: background 0.2s, color 0.2s;
    }

    .filter-btn.active {
      background: #f0eeff;
      color: #667eea;
    }

    .filter-btn:hover:not(.active) {
      background: #f5f5f5;
      color: #555;
    }

    /* Task list */
    .task-list {
      list-style: none;
      padding: 8px 0;
      min-height: 60px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 24px;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      background: #fafafa;
    }

    /* Custom checkbox */
    .checkbox {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 2px solid #d0d0d0;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .checkbox:hover {
      border-color: #667eea;
    }

    .task-item.done .checkbox {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .checkbox svg {
      display: none;
      width: 12px;
      height: 12px;
    }

    .task-item.done .checkbox svg {
      display: block;
    }

    .task-text {
      flex: 1;
      font-size: 0.97rem;
      color: #333;
      word-break: break-word;
      line-height: 1.4;
      transition: color 0.2s;
    }

    .task-item.done .task-text {
      color: #bbb;
      text-decoration: line-through;
    }

    .delete-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: color 0.2s, background 0.2s, opacity 0.2s;
    }

    .task-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #e55;
      background: #fff0f0;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 24px;
      color: #ccc;
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    /* Footer / stats */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-top: 1px solid #f0f0f0;
      font-size: 0.84rem;
      color: #aaa;
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 0.84rem;
      padding: 4px 0;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: #e55;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>My Tasks</h1>
    <p class="subtitle">Stay organised, stay productive.</p>

    <div class="card">
      <!-- Input -->
      <div class="input-section">
        <div class="input-row">
          <input
            class="task-input"
            id="taskInput"
            type="text"
            placeholder="Add a new task..."
            maxlength="200"
            autocomplete="off"
          />
          <button class="add-btn" id="addBtn">Add Task</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Completed</button>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="taskList"></ul>

      <!-- Footer -->
      <div class="footer">
        <span id="statsLabel">0 tasks left</span>
        <button class="clear-btn" id="clearDoneBtn">Clear completed</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo-app-tasks';

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentFilter = 'all';

    const taskInput   = document.getElementById('taskInput');
    const addBtn      = document.getElementById('addBtn');
    const taskList    = document.getElementById('taskList');
    const statsLabel  = document.getElementById('statsLabel');
    const clearDoneBtn = document.getElementById('clearDoneBtn');
    const filterBtns  = document.querySelectorAll('.filter-btn');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      taskInput.value = '';
      save();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function visibleTasks() {
      if (currentFilter === 'active') return tasks.filter(t => !t.done);
      if (currentFilter === 'done')   return tasks.filter(t =>  t.done);
      return tasks;
    }

    function render() {
      const visible = visibleTasks();
      const activeCount = tasks.filter(t => !t.done).length;

      statsLabel.textContent = `${activeCount} task${activeCount !== 1 ? 's' : ''} left`;

      if (visible.length === 0) {
        const msgs = {
          all:    { icon: '✅', text: 'No tasks yet — add one above!' },
          active: { icon: '🎉', text: 'All tasks are completed!' },
          done:   { icon: '📋', text: 'No completed tasks yet.' },
        };
        const m = msgs[currentFilter];
        taskList.innerHTML = `
          <li class="empty-state">
            <div class="icon">${m.icon}</div>
            <p>${m.text}</p>
          </li>`;
        return;
      }

      taskList.innerHTML = visible.map(task => `
        <li class="task-item ${task.done ? 'done' : ''}" data-id="${task.id}">
          <div class="checkbox" role="checkbox" aria-checked="${task.done}" tabindex="0" data-action="toggle">
            <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"/>
            </svg>
          </div>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn" aria-label="Delete task" data-action="delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Event delegation for task interactions
    taskList.addEventListener('click', e => {
      const item = e.target.closest('.task-item');
      if (!item) return;
      const id = Number(item.dataset.id);
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'toggle') toggleTask(id);
      if (action === 'delete') deleteTask(id);
    });

    // Keyboard support for checkboxes
    taskList.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const checkbox = e.target.closest('[data-action="toggle"]');
        if (checkbox) {
          e.preventDefault();
          const id = Number(checkbox.closest('.task-item').dataset.id);
          toggleTask(id);
        }
      }
    });

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearDoneBtn.addEventListener('click', clearCompleted);
    filterBtns.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));

    // Initial render
    render();
  </script>
</body>
</html>
